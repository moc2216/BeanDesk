name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: install
        run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: test
        run: bun test

      - name: typecheck and build
        run: bun run build

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: install
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: fetch the pinned restic binary
        run: bash engine/fetch-restic.sh

      - name: placeholder engine tree
        run: mkdir -p src-tauri/binaries/engine

      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: "3.12"
          architecture: x64

      - name: install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: lint and test the frontend
        working-directory: web
        shell: bash
        run: |
          bun run lint
          bun test

      - name: install handbook dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: prepare the Windows engine and restic
        shell: bash
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          bash engine/build.sh
          bash engine/fetch-restic.sh x86_64-pc-windows-msvc
          test -f src-tauri/binaries/engine/beandesk-engine.exe
          test -d src-tauri/binaries/engine/_internal
          test -f src-tauri/binaries/restic/restic.exe

      - name: check and test the desktop
        working-directory: src-tauri
        shell: bash
        run: cargo test --locked

      - name: typecheck the frontend and build the Windows installer
        run: bunx @tauri-apps/cli@2.12.6 build --ci

      - name: verify the installed Windows resources
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*_x64-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one Windows x64 NSIS installer' }
          $install = Join-Path $env:RUNNER_TEMP 'BeanDesk Smoke'
          $result = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed with exit code $($result.ExitCode)" }

          foreach ($resource in @('BeanDesk.exe', 'engine/beandesk-engine.exe', 'engine/_internal', 'restic/restic.exe', 'restic/LICENSE')) {
            if (!(Test-Path (Join-Path $install $resource))) { throw "Missing resource: $resource" }
          }

          $ledger = Join-Path $env:RUNNER_TEMP 'BeanDesk smoke.bean'
          Set-Content -Path $ledger -Encoding utf8 -Value 'option "title" "Windows smoke ledger"'
          & (Join-Path $install 'engine/beandesk-engine.exe') check $ledger
          if ($LASTEXITCODE -ne 0) { throw 'Frozen bean-check failed' }

          $version = & (Join-Path $install 'restic/restic.exe') version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^restic 0\.19\.1 .+ windows/amd64$') {
            throw "Unexpected restic version: $version"
          }

      - name: upload the Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BeanDesk-windows-x64
          path: src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: error
          retention-days: 7
